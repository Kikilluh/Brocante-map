name: Collecte des brocantes et déploiement

on:
  schedule:
    - cron: '17 4 * * *'   # tous les jours vers 5h/6h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'scraper/**', 'data/**', 'firebase.json', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests du collecteur
        run: npm test

      - name: Collecte des événements
        run: npm run scrape
        env:
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
          DATATOURISME_FEED_URL: ${{ secrets.DATATOURISME_FEED_URL }}
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "brocante-map-bot"
          git config user.email "brocante-map-bot@users.noreply.github.com"
          git add public/data scraper/cache
          if git diff --cached --quiet; then
            echo "Pas de changement"
          else
            git commit -m "Mise à jour des brocantes ($(date -u +%F))"
            # main a pu avancer pendant la collecte : on se replace dessus avant d'envoyer
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break
              sleep 5
            done
          fi

      - name: Bibliothèques de carte (Leaflet) intégrées au site
        run: |
          bash scripts/vendor.sh
          # pour mémoire : l'ancien lien CDN utilisé avant (diagnostic)
          curl -s -o /dev/null -w "cdnjs leaflet.min.js -> %{http_code}\n" https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js || true

      - name: Déploiement Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'brocante-map' }}

      - name: Vérifier le site en ligne
        if: env.HAS_FIREBASE == 'true'
        run: |
          sleep 10
          for f in "" app.js style.css vendor/leaflet/leaflet.js vendor/markercluster/leaflet.markercluster.js data/events.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://brocante-map.web.app/$f")
            echo "/$f -> $code"
            [ "$code" = "200" ] || exit 1
          done
