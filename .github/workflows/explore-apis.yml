name: Exploration des sources (diagnostic)

# Lancement manuel : sonde des sources possibles (sites de communes, agendas, données ouvertes)
# et enregistre les résultats sur la branche "exploration". Aucune donnée n'est publiée sur le site.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder les sources
        run: |
          mkdir out && cd out
          UA="BrocanteMapBot/1.0 (+https://github.com/kikilluh/brocante-map)"
          probe() { # $1 = nom court, $2 = URL
            curl -sS -L --max-time 40 -A "$UA" -o "$1.body" -D "$1.headers" -w "$1 -> %{http_code} %{content_type} %{url_effective}\n" "$2" >> report.txt 2>&1 || echo "$1 -> échec" >> report.txt
          }
          # Annuaire de l'administration (Service-Public.fr) : sites internet des mairies et intercommunalités
          A="https://api-lannuaire.service-public.fr/api/explore/v2.1/catalog/datasets/api-lannuaire-administration"
          probe annuaire-meta "$A"
          probe annuaire-mairies37 "$A/records?limit=5&where=pivot%20like%20%22mairie%22%20and%20code_insee_commune%20like%20%2237%2A%22"
          probe annuaire-search "$A/records?limit=3&where=search(%22mairie%20de%20dierre%22)"
          probe annuaire-epci37 "$A/records?limit=3&where=search(%22communaut%C3%A9%20de%20communes%22)%20and%20code_insee_commune%20like%20%2237%2A%22"
          for f in annuaire-*.body; do echo "=== $f" >> annuaire.txt; head -c 5000 "$f" >> annuaire.txt; echo >> annuaire.txt; done
          # Résumé : ce que contiennent les pages (données structurées, flux)
          for f in *.body; do
            n="${f%.body}"
            {
              echo "== $n"
              grep -io '<meta name="generator"[^>]*>' "$f" | head -3
              echo "JSON-LD : $(grep -c 'application/ld+json' "$f")  Event : $(grep -c '"@type" *: *"Event"' "$f")"
              grep -ioE 'href="[^"]*(ical|\.ics|webcal|/feed|rss)[^"]*"' "$f" | sort -u | head -8
              grep -ioE 'tribe-events|the-events-calendar|wp-json|intramuros|panneaupocket|illiwap|openagenda|campagnol|e-monsite|kalisport' "$f" | sort | uniq -c | head -10
            } >> summary.txt
          done
          # Listes de jeux data.gouv : titre, organisation, licence
          for f in dg-*.body; do
            echo "== $f" >> datasets.txt
            jq -r '.data[] | "\(.title) | \(.organization.name // "-") | \(.license) | \(.page)"' "$f" >> datasets.txt 2>/dev/null || true
          done
          rm -f dg-*.body
          ls -la
      - name: Enregistrer sur la branche exploration
        run: |
          cd out
          git init -q -b exploration
          git config user.name "brocante-map-bot"
          git config user.email "brocante-map-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Exploration des sources $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" exploration
