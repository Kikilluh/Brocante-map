name: Exploration des sources (diagnostic)

# Lancement manuel : sonde des sources possibles (sites de communes, agendas, données ouvertes)
# et enregistre les résultats sur la branche "exploration". Aucune donnée n'est publiée sur le site.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder les sources
        run: |
          mkdir out && cd out
          UA="BrocanteMapBot/1.0 (+https://github.com/kikilluh/brocante-map)"
          probe() { # $1 = nom court, $2 = URL
            curl -sS -L --max-time 40 -A "$UA" -o "$1.body" -D "$1.headers" -w "$1 -> %{http_code} %{content_type} %{url_effective}\n" "$2" >> report.txt 2>&1 || echo "$1 -> échec" >> report.txt
          }
          # Agenda culturel du Loir-et-Cher (Licence Ouverte) : page, flux éventuels
          probe c41-agenda "http://culture41.fr/Agenda-culturel/"
          probe c41-robots "http://culture41.fr/robots.txt"
          probe c41-rss    "http://culture41.fr/spip.php?page=backend"
          probe c41-ical   "http://culture41.fr/spip.php?page=ical"
          head -c 6000 c41-agenda.body > c41-agenda-extrait.txt || true
          grep -oE 'href="[^"]*"' c41-agenda.body | sort -u | head -80 > c41-liens.txt || true
          # Itinéraires du Parc du Vercors (GeoPackage) : tables, colonnes, système de coordonnées, exemples
          curl -sS -L --max-time 120 -A "$UA" -o vercors.gpkg "https://static.data.gouv.fr/resources/itineraires-de-randonnee-sur-le-parc-du-vercors/20250106-105438/itineraires.gpkg"
          python3 - <<'PY' > vercors.txt
          import sqlite3
          c = sqlite3.connect('vercors.gpkg')
          print(c.execute("select table_name, data_type, srs_id from gpkg_contents").fetchall())
          print(c.execute("select srs_id, organization, organization_coordsys_id from gpkg_spatial_ref_sys").fetchall())
          for (t,) in c.execute("select table_name from gpkg_contents where data_type='features'").fetchall():
              cols = [r[1] for r in c.execute(f'pragma table_info("{t}")')]
              print('TABLE', t, c.execute(f'select count(*) from "{t}"').fetchone()[0], cols)
              for row in c.execute(f'select * from "{t}" limit 3'):
                  print({k: (v if not isinstance(v, bytes) else f'<{len(v)} octets>') for k, v in zip(cols, row)})
          PY
          rm -f vercors.gpkg
          # Résumé : ce que contiennent les pages (données structurées, flux)
          for f in *.body; do
            n="${f%.body}"
            {
              echo "== $n"
              grep -io '<meta name="generator"[^>]*>' "$f" | head -3
              echo "JSON-LD : $(grep -c 'application/ld+json' "$f")  Event : $(grep -c '"@type" *: *"Event"' "$f")"
              grep -ioE 'href="[^"]*(ical|\.ics|webcal|/feed|rss)[^"]*"' "$f" | sort -u | head -8
              grep -ioE 'tribe-events|the-events-calendar|wp-json|intramuros|panneaupocket|illiwap|openagenda|campagnol|e-monsite|kalisport' "$f" | sort | uniq -c | head -10
            } >> summary.txt
          done
          # Listes de jeux data.gouv : titre, organisation, licence
          for f in dg-*.body; do
            echo "== $f" >> datasets.txt
            jq -r '.data[] | "\(.title) | \(.organization.name // "-") | \(.license) | \(.page)"' "$f" >> datasets.txt 2>/dev/null || true
          done
          rm -f dg-*.body
          ls -la
      - name: Enregistrer sur la branche exploration
        run: |
          cd out
          git init -q -b exploration
          git config user.name "brocante-map-bot"
          git config user.email "brocante-map-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Exploration des sources $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" exploration
